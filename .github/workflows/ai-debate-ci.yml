name: AI Debate CI
on:
  push:
    paths: ["ai-debate/**", ".github/workflows/ai-debate-ci.yml"]
  pull_request:
    paths: ["ai-debate/**", ".github/workflows/ai-debate-ci.yml"]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-debate/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-debate/app/package-lock.json
      - run: npm ci
      - name: Workflow JSON khớp mã nguồn
        run: npm run check:workflow
      - name: Unit + tích hợp (mock API, mini-n8n)
        run: npm test

  e2e-docker:
    # Postgres + n8n thật + app + MOCK LLM. Không dùng API key thật.
    runs-on: ubuntu-latest
    needs: unit-and-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: E2E với n8n thật
        working-directory: ai-debate
        run: ./scripts/e2e.sh
