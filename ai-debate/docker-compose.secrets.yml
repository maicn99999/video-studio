# Tùy chọn: đọc API key từ Docker secrets (file riêng, quyền 600) thay vì ghi trong .env.
# Dùng: docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# Chuẩn bị: mkdir -p secrets && chmod 700 secrets
#           printf '%s' 'sk-...'      > secrets/openai_api_key.txt
#           printf '%s' 'sk-ant-...'  > secrets/anthropic_api_key.txt
#           printf '%s' 'AIza...'     > secrets/gemini_api_key.txt
#           chmod 600 secrets/*.txt
# (Với Docker Swarm / secret manager khác: trỏ *_FILE tới đường dẫn secret được mount.)
services:
  app:
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
    secrets: [openai_api_key, anthropic_api_key, gemini_api_key]

secrets:
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
